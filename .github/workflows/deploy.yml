name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          echo "Stopping and removing old containers..."
          docker compose down -v || true
          docker rm -f $(docker ps -aq) || true
          
          echo "Starting application stack..."
          docker compose up -d 
          echo "Waiting for services to start..."
          sleep 20

      - name: Verify containers are running
        run: |
          docker compose ps
          if docker compose ps | grep -q "Up"; then
            echo "✓ All containers are running"
          else
            echo "✗ Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Run application tests
        run: |
          echo "✓ Running application tests..."
          sleep 10
          
          echo "1. Testing connectivity to the web application..."
          if curl -s -o /dev/null http://localhost:${{ secrets.APP_PORT }}/; then
            echo "✓ Web application is up and responding"
          else
            echo "✗ Web application is not responding"
            docker compose logs
            exit 1
          fi

          echo "2. Testing data consistency..."
          DB_CONTAINER_ID=$(docker ps -q -f "ancestor=postgres:16-alpine")
          if [ -z "$DB_CONTAINER_ID" ]; then
            DB_CONTAINER_ID=$(docker ps -q | xargs -r docker inspect --format='{{.Id}} {{.Config.Image}}' | grep postgres | awk '{print $1}')
          fi
          
          echo "Found DB container: $DB_CONTAINER_ID"
          DB_COUNT=$(docker exec -i $DB_CONTAINER_ID psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \n\r' || echo "0")
          
          echo "Database count: $DB_COUNT"
          
          if [ "$DB_COUNT" -gt "0" ]; then
            echo "✓ Database has data and is accessible"
          else
            echo "✗ Database is empty or unreachable"
            exit 1
          fi

      # НОВЫЙ ШАГ: Восстанавливаем .env перед загрузкой
      - name: Recreate .env file for artifact
        run: |
          echo "Recreating .env file for artifact upload..."
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-and-env
          path: .env
          retention-days: 7
